# Week 2 Lab — Local Services Stack (Solution)
#
# Four services:
#   postgres           — relational backend store (metadata: params, metrics, tags)
#   s3                 — object store (artifacts: model files, plots)
#   s3-create-bucket   — one-shot job that creates the artifacts bucket
#   mlflow             — tracking server (proxies between client, Postgres, and Silo)
#
# Canonical tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Required deviation: mlflow server is containerized (fourth compose service) rather than
#   run on the host, so the whole stack starts with a single "docker compose up -d --wait".
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --wait    # bring all four services up and wait for healthchecks
#   docker compose down            # stop (data persists in named volumes)
#   docker compose down -v         # stop AND wipe volumes (fresh start)

# Explicit project name. Compose otherwise defaults the project name to the base
# DIRECTORY name — which is "starter"/"solution" for EVERY lab in this course, so
# without this every week would silently share one project, one set of containers,
# and one set of volumes.
name: week02-local-services

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Stores experiment names, run IDs, parameters, metrics, and tags.
  # Image pinned to 16.3 for reproducibility.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Silo: S3-compatible object store ───────────────────────────────────────
  # Silo is a community fork of MinIO (MinIO's own images left Docker Hub in
  # September 2026). It keeps MinIO's MINIO_* variables, `mc` client and console.
  # Stores model artifacts (serialized pipelines, plots, etc.).
  # Uses a TCP healthcheck (from the official MLflow tutorial) rather than
  # the HTTP endpoint, for maximum compatibility.
  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT:-5510}:9000"
      - "${S3_CONSOLE_PORT:-5511}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── s3-create-bucket: one-shot bucket initialisation ───────────────────────
  # Runs once after Silo is healthy. Creates the artifacts bucket if it does
  # not already exist (idempotent via --ignore-existing).
  s3-create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set s3 http://s3:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        mc mb --ignore-existing s3/${MLFLOW_BUCKET}
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # Built from our pinned mlflow.Dockerfile.
  # --backend-store-uri: Postgres connection using the compose DNS name "postgres"
  # --artifacts-destination: Silo bucket via S3 protocol
  # --allowed-hosts: required by MLflow 3.5.0+ security middleware (--host 0.0.0.0)
  # The client only needs MLFLOW_TRACKING_URI; Silo credentials stay server-side.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      # Silo S3 credentials — server-side only, not exposed to the client
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command:
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      # MLflow's host check is an exact/fnmatch match that does NOT strip the port,
      # so bare "localhost" will not match the browser's "Host: localhost:5500".
      # The "host:*" wildcards accept any port (host 5500, internal 5000, or a
      # student-overridden MLFLOW_PORT) while still restricting to localhost/127.0.0.1.
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
