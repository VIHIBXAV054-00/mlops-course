[project]
name = "week-04-dvc-introduction"
version = "0.1.0"
description = "Week 4 guided lab — DVC data versioning with Silo as the S3 remote"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",       # upper bound: every week stays on one major
    "python-dotenv>=1.0.0",
    "mlflow==3.13.0",         # must match the server pin in mlflow.Dockerfile
    "dvc[s3]>=3.67.1",
    "joblib>=1.4.0",
    "pyyaml>=6.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "live: requires the Docker Compose stack to be running",
    "dvc: requires a DVC-initialised repo (Exercise 1)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_04_dvc_introduction"]
