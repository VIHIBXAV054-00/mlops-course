[project]
name = "week-08-prefect-flow"
version = "0.1.0"
description = "Week 6 guided lab — model quality gates, slice evaluation and go/no-go"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    # UPPER BOUND, deliberate. With `>=2.0.0` alone, Week 1's stale lock
    # re-resolved to pandas 3.0.5 on a fresh clone while Weeks 2-5 sat at
    # 2.3.3, and any future `uv lock` would have carried the rest of the
    # course across a major version one week at a time. The pinned baseline
    # (LR F1 0.5785 / accuracy 0.7344) is unaffected by 3.x -- measured both
    # ways on data/diabetes.csv -- so this is skew protection, not a bug fix.
    # Lift it for every week at once, after re-measuring the pins.
    "pandas>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    # PINNED, not >=. The tracking server is pinned to 3.13.0 in
    # mlflow.Dockerfile, and mlflow 3.15.0 changed the default
    # `serialization_format` of log_model from cloudpickle to skops — which
    # silently renames the logged artifact from model.pkl to model.skops and
    # invalidates every Silo path documented in Weeks 2-4. Client and server
    # move together, deliberately.
    "mlflow==3.13.0",
    # DVC with the S3 remote extra (resolves dvc-s3>=3.2.1,<4).
    "dvc[s3]>=3.67.1",
    # We call joblib and yaml directly, so declare them rather than relying on
    # scikit-learn / mlflow to keep pulling them in transitively.
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    # NEW in Week 5. The `[pandas]` extra is NOT optional: since pandera 0.24.0
    # the base install carries neither pandas nor numpy (its only runtime deps
    # are packaging, pydantic, typeguard, typing_extensions, typing_inspect), so
    # a bare `pandera` imports fine and then fails at the first
    # `pandera.pandas` reference.
    "pandera[pandas]>=0.32.1",
    # NEW in Week 8. Client pin matches the server image in compose.yaml
    # (prefecthq/prefect:3.8.2-python3.12) for the same reason mlflow does: a
    # client and a server that drift are a bug you debug through a REST API.
    #
    # It brings 55 transitive packages, including fastapi and prometheus-client
    # -- Weeks 9 and 11 arriving early as somebody else's dependencies. They
    # are installed and must not be imported; tests/test_scope.py enforces that.
    "prefect==3.8.2",
    "fairlearn>=0.14.0",  # Week 6: metrics per group and the fairness metrics
]

# NOTE ON boto3 — deliberately ABSENT.
#
# Weeks 2-3 listed `boto3>=1.38.0` here, but nothing on the client side ever
# imported it: the MLflow client talks only to the tracking server, which
# proxies artifacts to Silo on its behalf. boto3 is also not a hard MLflow
# dependency (it appears only under mlflow's extras/databricks/gateway/genai).
#
# It is worth removing rather than merely unnecessary. `dvc[s3]` reaches S3 via
# dvc-s3 -> s3fs -> aiobotocore -> botocore, and aiobotocore caps botocore
# (<1.43.47 at the time of writing) well below what a current boto3 requires
# (>=1.43.62). uv still resolves both by backtracking boto3 to an older
# release, so this is a silent downgrade rather than an error — which is
# exactly the kind of thing that breaks a lab six months from now.
#
# The SERVER still pins boto3, correctly, in mlflow.Dockerfile.
#
# matplotlib is dropped too: the ROC/confusion plots are Week 3's lesson, and
# Week 4's complexity budget belongs to DVC.

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
# NEW in Week 7, and PINNED to an exact version rather than a floor.
#
# The pin is the lesson, not caution. Measured on this lab's own source with
# ruff 0.16.1: the DEFAULT rule set reports 24 errors across 11 rules, while
# the documented default (`E4`, `E7`, `E9`, `F`) reports 2. Ruff's default
# selection has broadened over releases, so an unpinned linter fails your build
# on a morning when you changed nothing at all. That is the cheapest possible
# demonstration of why CI tooling gets pinned, and it is why `select` below is
# explicit rather than inherited.
#
# Lift the pin deliberately: bump it, run `make lint`, read the new findings,
# then decide whether to fix them or narrow `select`.
lint = [
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
markers = [
    # ── TWO AXES, and keeping them apart is the point of Exercise 3. ──────────
    #
    # AXIS 1 — the pyramid layer: what a test ASSERTS. Every test carries
    # exactly one of these, and each gets its own CI job so a red X names the
    # layer that broke.
    "unit: our code is correct. No dataset, no model, no services. Milliseconds.",
    "data: the data and its contracts are correct (Week 5's material).",
    "eval: the model, its metrics and the release gate are correct (Week 6's).",
    "integration: several real components at once, over a real connection.",
    #
    # AXIS 2 — the infrastructure guard: what a test NEEDS. Orthogonal to the
    # layer above; a test may carry one, both or neither.
    "live: requires the Docker Compose stack to be running",
    "dvc: requires a DVC-initialised repo (carried over from Week 4)",
]
# pytest manages warning filters itself, so validation.py's own
# `warnings.filterwarnings` call does not survive here — the same filter has to
# be repeated. It silences a pandas FutureWarning raised INSIDE pandera 0.32.1
# when it assembles a failure report containing a null; it says nothing about
# your data. Scoped by message and module so a real deprecation still shows up.
filterwarnings = [
    "ignore:The behavior of DataFrame concatenation with empty or all-NA entries:FutureWarning:pandera.backends.pandas.error_formatters",
    # joblib 1.5.x sets `array.shape` directly when unpickling, which numpy 2.5
    # deprecated. Also third-party, also unrelated to your code. (Weeks 1-4 emit
    # this too; it is not something Week 5 introduced.)
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
# Match the interpreter the labs target, so version-gated rules behave.
target-version = "py312"

[tool.ruff.lint]
# EXPLICIT, and deliberately conservative. These four are ruff's own documented
# default: E4 (imports), E7 (statement style), E9 (syntax/IO errors) and F
# (pyflakes -- undefined names, unused imports, f-strings with no placeholder).
# They catch real defects and essentially never argue about taste.
#
# Everything else is opt-in. A course lab is a bad place to litigate style, and
# a linter that fails a build over a preference is a linter students learn to
# disable. Widen this list when you have a reason you can name.
select = ["E4", "E7", "E9", "F"]

# NOTE: there is deliberately NO `ruff format` gate in this lab.
# `ruff format --diff` reports 16 of 35 files would be reformatted. That is a
# defensible thing to want, and it is not what Week 7 is teaching -- the diff
# would bury every change that is actually about CI. Formatting is a decision
# for a project's first commit, not its seventh week.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_08_prefect_flow"]
