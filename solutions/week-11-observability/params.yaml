# Pipeline hyperparameters and release policy. DVC tracks this file.
# `evaluation` says what we measure. `acceptance` says whether it passes, so a
# change to `acceptance` re-runs only the `gate` stage and retrains nothing.

random_seed: 42

prepare:
  test_size: 0.25

train:
  family: logreg
  C: 1.0
  max_iter: 1000
  # How the model fills missing values: median, mean or most_frequent.
  impute_strategy: median
  # Used only when `family: rf`.
  n_estimators: 100

# ── What we measure ───────────────────────────────────────────────────────────
# Bins are left-closed, right-open: [21, 30) means 21 to 29.
# Slices are cut on the raw data, before imputation.
evaluation:
  slices:
    age_band:
      column: age
      kind: bins
      bins: [21, 30, 40, 50, .inf]
      labels: ["21-29", "30-39", "40-49", "50+"]

    bmi_band:
      column: bmi
      kind: bins
      bins: [0, 25, 30, .inf]
      labels: ["under_normal", "overweight", "obese"]
      # A bmi of 0 is a missing measurement, so it gets its own group.
      missing_label: "missing"

    insulin_missing:
      column: insulin
      kind: missing_flag
      labels: ["insulin_present", "insulin_missing"]

# ── Whether it is good enough ─────────────────────────────────────────────────
acceptance:
  # Bump this whenever a threshold moves. It is stamped onto the MLflow run.
  criteria_version: "1.0.0"

  # Absolute floors. A model that always predicts "no diabetes" scores 0.6510 accuracy.
  minimum:
    accuracy: 0.70
    f1: 0.55
    roc_auc: 0.75

  # Compared with the current baseline. max_drop is a noise band, not a budget.
  regression:
    primary_metric: f1
    max_drop: 0.01
    also_report: [accuracy, roc_auc]

  # Per-slice rules. A slice with too few rows or positives is skipped, and reported.
  slice_rules:
    min_support: 20
    min_positives: 10
    min_f1: 0.50
    max_f1_gap: 0.10

  # Fairness limits per gated slice. A slice not listed is report-only.
  fairness:
    insulin_missing:
      max_selection_rate_gap: 0.10
      max_tpr_gap: 0.20
    age_band:
      max_tpr_gap: 0.25
