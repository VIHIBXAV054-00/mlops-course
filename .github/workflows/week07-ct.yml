name: Week 7 CT

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you starting continuous training?
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Why this run happened
        env:
          RUN_REASON: ${{ inputs.reason }}
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          if [ -n "$RUN_REASON" ]; then
            echo "Reason: $RUN_REASON"
          else
            echo "Reason: scheduled run"
          fi
      - name: Rebuild the dataset
        run: make data-v2
      - name: retrain and gate
        run: make ct-local
      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=CT failed::Retraining or the model gate failed. See the job summary and evidence artifact."
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week-7-ct-evidence
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
          if-no-files-found: ignore
