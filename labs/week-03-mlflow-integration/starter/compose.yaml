# Week 3 Lab — MLflow Integration (starter)
#
# The Week 2 stack, unchanged. Week 3 adds no service: the model registry lives
# in the same Postgres database as the tracking store.
#
#   postgres             relational backend store — params, metrics, tags
#   minio                object store — model files and plots
#   minio-create-bucket  one-shot job that creates the artifacts bucket
#   mlflow               tracking server, between the client and the two stores
#
# Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Deviation: the tracking server is containerized rather than run on the host,
# so the whole stack starts with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait    # start, and wait for healthchecks
#   docker compose down            # stop; data persists in the named volumes
#   docker compose down -v         # stop and wipe the volumes
#
# Stop any other lab's stack first — every lab shares the 55xx host ports:
#   cd ../../week-02-local-services/starter && docker compose down

# A per-lab project name. Without it Compose uses the directory name
# ("starter"), which every lab in this course shares — and so would their
# containers and volumes.
name: week03-mlflow-integration-starter

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Experiment names, run IDs, params, metrics, tags. Image pinned.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO: S3-compatible object store ──────────────────────────────────────
  # Serialized models and plots.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z.hotfix.ca75c7346
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-5510}:9000"
      - "${MINIO_CONSOLE_PORT:-5511}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── minio-create-bucket: one-shot bucket initialisation ────────────────────
  # Runs once after MinIO is healthy; --ignore-existing makes it idempotent.
  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing minio/${MINIO_BUCKET}
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # Built from the pinned mlflow.Dockerfile. The client only ever needs
  # MLFLOW_TRACKING_URI; the MinIO credentials below stay server-side.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      # MinIO S3 credentials — server-side only, not exposed to the client
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MINIO_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      # The host check does not strip the port, so bare "localhost" would not
      # match "localhost:5500". The "host:*" wildcards accept any port.
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
