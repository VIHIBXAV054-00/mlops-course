name: Week 7 CI

on:
  push:
    paths:
      - "labs/week-07-ci-workflow/starter/**"
      - ".github/workflows/week07-ci.yml"
  pull_request:
    paths:
      - "labs/week-07-ci-workflow/starter/**"
      - ".github/workflows/week07-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: uv sync --locked --group lint
      - name: Run linter
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, data, eval]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run ${{ matrix.layer }} tests
        run: make test-${{ matrix.layer }}

  pipeline:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Rebuild the dataset
        run: make data-v2
      - name: "validate -> prepare -> train -> evaluate -> gate"
        run: make ci
      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=CI failed::The checks or model gate failed. See the job summary and evidence artifact."
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week-7-ci-evidence
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
          if-no-files-found: ignore
