[project]
name = "week-11-observability"
version = "0.1.0"
description = "Week 11 guided lab — observability: metrics, SLIs, SLOs, error budgets, dashboards and alerting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    # Same version as the tracking server in mlflow.Dockerfile.
    "mlflow==3.13.0",
    "dvc[s3]>=3.67.1",
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    # The [pandas] extra installs pandas support, which the base package lacks.
    "pandera[pandas]>=0.32.1",
    # Same version as the Prefect server image in compose.yaml.
    "prefect==3.8.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "fairlearn>=0.14.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
lint = [
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
markers = [
    # The test layer: what a test checks. Every test has exactly one.
    "unit: our code is correct. No dataset, no model, no services. Milliseconds.",
    "data: the data and its contracts are correct (Week 5's material).",
    "eval: the model, its metrics and the release gate are correct (Week 6's).",
    "integration: several real components at once, over a real connection.",
    # What a test needs to run. A test may have one, both or neither.
    "live: requires the Docker Compose stack to be running",
    "dvc: requires a DVC-initialised repo (carried over from Week 4)",
]
# Warnings from third-party packages, not from this lab's code.
filterwarnings = [
    "ignore:The behavior of DataFrame concatenation with empty or all-NA entries:FutureWarning:pandera.backends.pandas.error_formatters",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's documented default rules: imports, statements, syntax errors and pyflakes.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_11_observability"]
