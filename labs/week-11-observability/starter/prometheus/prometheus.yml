# Prometheus configuration: what to scrape and which rule files to load.
# Tutorial:  https://prometheus.io/docs/prometheus/latest/getting_started/
# Reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Added to every series and alert from this server.
  external_labels:
    environment: lab
    course: mlops-week11

rule_files:
  - /etc/prometheus/rules/*.yml

# No `alerting:` block: there is no Alertmanager. Firing alerts show on the /alerts page.

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

