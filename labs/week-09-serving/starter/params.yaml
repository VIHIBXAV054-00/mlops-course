# Pipeline hyperparameters and release policy, read by the dvc.yaml stages.
# evaluate reads "evaluation" and gate reads "acceptance", so a threshold change re-runs only gate.

random_seed: 42

prepare:
  test_size: 0.25

train:
  family: logreg
  C: 1.0
  max_iter: 1000
  # How the pipeline fills missing values: median, mean or most_frequent.
  impute_strategy: median
  # Used only when family is rf.
  n_estimators: 100

# ── What we measure ───────────────────────────────────────────────────────────
# Slices are cut on the raw data, before imputation. A bin includes its left edge
# and excludes its right edge: [21, 30) is 21–29.
evaluation:
  slices:
    age_band:
      column: age
      kind: bins
      bins: [21, 30, 40, 50, .inf]
      labels: ["21-29", "30-39", "40-49", "50+"]

    bmi_band:
      column: bmi
      kind: bins
      bins: [0, 25, 30, .inf]
      labels: ["under_normal", "overweight", "obese"]
      # A bmi of 0 is a missing measurement, so it gets its own group.
      missing_label: "missing"

    insulin_missing:
      column: insulin
      kind: missing_flag
      labels: ["insulin_present", "insulin_missing"]

# ── Whether it is good enough ─────────────────────────────────────────────────
acceptance:
  # Change this whenever a threshold changes; it is logged to the MLflow run.
  criteria_version: "1.0.0"

  # Absolute floors. A model that always predicts "no diabetes" scores 0.6510 accuracy.
  minimum:
    accuracy: 0.70
    f1: 0.55
    roc_auc: 0.75

  # max_drop: the noise band, not an allowed loss.
  regression:
    primary_metric: f1
    max_drop: 0.01
    also_report: [accuracy, roc_auc]

  # Slices with fewer rows or positives than these are skipped, not gated.
  slice_rules:
    min_support: 20
    min_positives: 10
    min_f1: 0.50
    max_f1_gap: 0.10

  # One key per gated slice axis; an axis not listed is only reported.
  fairness:
    insulin_missing:
      max_selection_rate_gap: 0.10
      max_tpr_gap: 0.20
    age_band:
      max_tpr_gap: 0.25
