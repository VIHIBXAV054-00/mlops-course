[project]
name = "week-09-serving"
version = "0.1.0"
description = "Week 9 guided lab — model serving with FastAPI, Docker and Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",       # upper bound: every week stays on one major
    "python-dotenv>=1.0.0",
    "mlflow==3.13.0",         # must match the server pin in mlflow.Dockerfile
    "dvc[s3]>=3.67.1",        # [s3]: DVC's driver for the Silo remote
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    "pandera[pandas]>=0.32.1",  # [pandas]: the base package does not install pandas
    "prefect==3.8.2",         # must match the server image in compose.yaml
    # The web service. httpx is what FastAPI's TestClient uses.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "fairlearn>=0.14.0",      # metrics per group (fairness checks)
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
lint = [
    "ruff==0.16.1",  # pinned: a new ruff release can add rules and fail CI
]

[tool.pytest.ini_options]
markers = [
    # What a test checks (one per test):
    "unit: our code is correct. No dataset, no model, no services. Milliseconds.",
    "data: the data and its contracts are correct.",
    "eval: the model, its metrics and the release gate are correct.",
    "integration: several real components at once, over a real connection.",
    # What a test needs to run:
    "live: requires the Docker Compose stack to be running",
    "dvc: requires a DVC-initialised repo",
]
# Third-party warnings that say nothing about your code:
filterwarnings = [
    "ignore:The behavior of DataFrame concatenation with empty or all-NA entries:FutureWarning:pandera.backends.pandas.error_formatters",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's documented default rules, listed so a new ruff release cannot change them.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_09_serving"]
