# Two pods running the diabetes-api image, with a readiness and a liveness probe.
# TODO(student) Exercise 5: replace each <fill in>. The comment next to it says what goes there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-api
  labels:
    app: diabetes-api        # a label on the Deployment itself, not on its pods
spec:
  replicas: <fill in>        # enough pods that one can stop while another serves
  selector:
    matchLabels:
      app: <fill in>         # the same value as the pods' label in template.metadata.labels below
  template:                  # the pod that Kubernetes creates `replicas` times
    metadata:
      labels:
        app: <fill in>       # the pods' label from k8s/README.md; `make k8s-status` selects by it
    spec:
      containers:
        - name: api
          image: diabetes-api:local
          imagePullPolicy: <fill in>       # the image is copied onto the node, so never pull it
          ports:
            - containerPort: 8000
              name: <fill in>              # a name for this port; the probes and service.yaml use it

          # While readiness fails, the Service sends the pod no traffic.
          readinessProbe:
            httpGet:
              path: <fill in>              # the route in api.py that says whether the model is loaded
              port: <fill in>              # the port name you gave under ports above
            initialDelaySeconds: <fill in> # seconds before the first probe
            periodSeconds: <fill in>       # seconds between probes
            failureThreshold: <fill in>    # failed probes in a row before it gives up

          # When liveness fails, Kubernetes restarts the container, so it must give up later than
          # readiness. A probe gives up after initialDelaySeconds + periodSeconds × failureThreshold.
          livenessProbe:
            httpGet:
              path: <fill in>              # the same route as the readiness probe above
              port: <fill in>              # the port name you gave under ports above
            initialDelaySeconds: <fill in> # these three must give up later than readiness's three
            periodSeconds: <fill in>
            failureThreshold: <fill in>

          env:
            - name: MODEL_PATH
              value: /app/models/model.pkl
