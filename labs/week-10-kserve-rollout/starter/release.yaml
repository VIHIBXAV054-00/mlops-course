model:
  candidate: v2
  replaces: v1

strategy: canary

canary:
  percent: 10

smoke:
  min_probability_spread: 0.1

load:
  expected_rps: 20
  max_p95_ms: 300
  max_error_rate: 0.01

promote:
  when:
    - 24 hours without a failed check or 5xx response
    - p95 latency stays under 300 ms

rollback:
  when:
    - any smoke check fails
    - error rate exceeds 1% over any 5-minute window
