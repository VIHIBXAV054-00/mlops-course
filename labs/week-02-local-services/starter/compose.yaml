# Week 2 Lab — Local Services Stack (starter)
#
#   postgres             relational backend store — params, metrics, tags
#   s3                   object store — model files and plots
#   s3-create-bucket     one-shot job that creates the artifacts bucket
#   mlflow               tracking server, between the client and the two stores
#
# Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Deviation: the tracking server is containerized rather than run on the host,
# so the whole stack starts with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait    # start, and wait for healthchecks
#   docker compose down            # stop; data persists in the named volumes
#   docker compose down -v         # stop and wipe the volumes

# A per-lab project name. Without it Compose uses the directory name
# ("starter"), which every lab in this course shares — and so would their
# containers and volumes.
name: week02-local-services-starter

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Experiment names, run IDs, params, metrics, tags. Image pinned.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Silo: S3-compatible object store ───────────────────────────────────────
  # Silo is a community fork of MinIO (MinIO's own images left Docker Hub in
  # September 2026). It keeps MinIO's MINIO_* variables, `mc` client and console.
  #
  # TODO(student) — Exercise 1: fill in the empty keys of the `s3` service.
  # The ports, volume and timings are done; the postgres service above is a
  # complete example of the same shape.
  #   - image: Silo, pinned to the release the README names.
  #   - environment: the root user and password come from S3_ACCESS_KEY and
  #     S3_SECRET_KEY in .env. Look at how postgres reads its .env values.
  #   - command: start the server with its data in /data and the web console
  #     on the container port 9001.
  #   - healthcheck test: same form as the postgres healthcheck. The image
  #     ships the `mc` client, with an alias named `local` that points at this
  #     server. Find the mc command that reports whether a server is ready.
  # Container guide: https://silo.pigsty.io/operations/deployments/baremetal-deploy-minio-as-a-container/
  # mc commands: https://silo.pigsty.io/reference/minio-mc/
  s3:
    image:
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD:
    command:
    ports:
      - "${S3_API_PORT:-5510}:9000"
      - "${S3_CONSOLE_PORT:-5511}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── s3-create-bucket: one-shot bucket initialisation ───────────────────────
  # TODO(student) — Exercise 1: write the job that creates MLflow's bucket.
  #   - image: the `pgsty/mc` client, pinned to the same release as Silo.
  #   - entrypoint: two mc commands. The first gives the server an alias, with
  #     the keys from .env. Inside the compose network, a service's name is its
  #     hostname, and Silo's S3 API listens on 9000. The second creates the
  #     bucket named by MLFLOW_BUCKET.
  #   - The job runs on every `docker compose up`, so the second command must
  #     succeed when the bucket already exists. The mc reference has a flag
  #     for that.
  # mc commands: https://silo.pigsty.io/reference/minio-mc/
  s3-create-bucket:
    image:
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        echo 'TODO(student): create the bucket'
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # TODO(student) — Exercise 2: fill in the empty values of the mlflow service.
  #   - environment: the server, not your Python client, stores the artifacts in
  #     Silo. Give it Silo's S3 endpoint inside the compose network, and the
  #     Silo keys from .env under the AWS_* names the S3 library reads.
  #   - --backend-store-uri: a PostgreSQL connection URI built from the
  #     POSTGRES_* values in .env. Use the service name as the hostname, and
  #     the container port, not the host port.
  #   - --artifacts-destination: the bucket from Exercise 1, as an s3:// URI.
  #   - --allowed-hosts: the names the server is reached by: localhost,
  #     127.0.0.1 and mlflow. The check compares the whole Host header, port
  #     included, so allow each name with any port as well.
  # Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
  # Allowed hosts: https://mlflow.org/docs/latest/self-hosting/security/network/
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      MLFLOW_S3_ENDPOINT_URL:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
    command:
      - --backend-store-uri
      -
      - --artifacts-destination
      -
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      -
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data: