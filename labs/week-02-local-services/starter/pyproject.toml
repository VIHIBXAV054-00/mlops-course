[project]
name = "week-02-local-services"
version = "0.1.0"
description = "Week 2 guided lab — local services stack (MLflow + Silo + Postgres)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    "mlflow==3.13.0",
    "boto3>=1.38.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week_02_local_services"]
