# Grafana datasource, provisioned from a file so it is versioned in Git.
# Reference: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Grafana's server sends the queries, so the Docker network name resolves.
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Every panel in grafana/dashboards/*.json uses this uid.
    uid: prometheus
    editable: false
    jsonData:
      # Matches the scrape interval in prometheus.yml.
      timeInterval: 15s
      httpMethod: POST
