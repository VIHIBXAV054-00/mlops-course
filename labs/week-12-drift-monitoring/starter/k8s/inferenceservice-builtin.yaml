# The same model on KServe's built-in scikit-learn runtime: no image, no code.
# The runtime has its own scikit-learn and Python versions, which may not load our model.
# Delete it with `kubectl delete -f k8s/inferenceservice-builtin.yaml`.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: diabetes-builtin
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: sklearn
      # Built-in runtimes take the `storageUri` field. Custom containers use STORAGE_URI.
      storageUri: pvc://diabetes-models/v1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
