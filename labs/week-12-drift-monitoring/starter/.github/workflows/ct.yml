# CT: retrains and gates the model on a schedule or by hand, with no code change.
# It runs the same make target as ci.yml. `make install-ci` copies it to the
# repository root, where GitHub runs workflows.
name: Week 12 CT

on:
  # Started by hand from the Actions tab, with a reason.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you retraining? (recorded in the run)'
        required: true
        default: 'manual check'
        type: string

  # 03:00 UTC on Mondays. GitHub may start a scheduled run late, and it turns
  # schedules off after 60 days without activity in a public repository.
  schedule:
    - cron: '0 3 * * 1'

defaults:
  run:
    working-directory: labs/week-12-drift-monitoring/solution

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups

      - name: Why this run happened
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "reason : ${{ inputs.reason || 'scheduled' }}"

      - name: Rebuild the dataset
        run: make data-v2

      # The same make target as ci.yml. tests/test_workflows.py checks this.
      - name: retrain and gate
        run: make ct-local

      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a NO-GO
        if: failure()
        run: |
          echo "::error title=Scheduled retrain refused::The new model did not clear the acceptance criteria. Nothing was released."

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ct-evidence
          if-no-files-found: warn
          path: |
            labs/week-12-drift-monitoring/solution/metrics/
            labs/week-12-drift-monitoring/solution/reports/
            labs/week-12-drift-monitoring/solution/models/model.pkl

  # CT stops here: `register` and `promote` need the MLflow server, and a
  # GO from the gate alone does not release a model.
