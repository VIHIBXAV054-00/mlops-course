# Prometheus configuration: what to scrape and which rule files to load.
# Tutorial:  https://prometheus.io/docs/prometheus/latest/getting_started/
# Reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Added to every series and alert from this server.
  external_labels:
    environment: lab
    course: mlops-week12

rule_files:
  - /etc/prometheus/rules/*.yml

# No `alerting:` block: there is no Alertmanager. Firing alerts show on the /alerts page.

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # `api` is the Compose service name. The target is down until `make api-up`.
  - job_name: diabetes-api
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: diabetes-api
